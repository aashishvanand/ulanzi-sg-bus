name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: pip-audit -r requirements.txt
      - name: n8n workflow templates are valid JSON with no secrets
        run: |
          for f in n8n_bus_workflow.json n8n_bus_workflow.ulanzi-firmware.json; do
            python -m json.tool "$f" > /dev/null
            if grep -q LTA_ACCOUNT_KEY "$f"; then echo "$f still carries an LTA key field"; exit 1; fi
          done
